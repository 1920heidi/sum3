databases:
  - name: sum3-db
    plan: free
    databaseName: sum3
    user: sum3

services:
  - type: web
    name: sum3-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sum3-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.7"

  - type: web
    name: sum3-client
    runtime: static
    buildCommand: cd client-with-jwt && npm install && npm run build
    staticPublishPath: client-with-jwt/build
    envVars:
      - key: REACT_APP_API_URL
        value: https://sum3-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
